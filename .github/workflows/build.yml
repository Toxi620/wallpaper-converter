name: Build App

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: 打包 (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            label: macOS
            ffmpeg_url: https://evermeet.cx/ffmpeg/ffmpeg-7.1.zip
            ffprobe_url: https://evermeet.cx/ffmpeg/ffprobe-7.1.zip
            separator: ":"
            ext: ""
          - os: windows-latest
            label: Windows
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            separator: ";"
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pyinstaller

      - name: 下载 ffmpeg (${{ matrix.label }})
        run: |
          curl -L -o /tmp/ffmpeg.zip "${{ matrix.ffmpeg_url }}"
          curl -L -o /tmp/ffprobe.zip "${{ matrix.ffprobe_url }}"
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-bin/
          unzip -o /tmp/ffprobe.zip -d /tmp/ffmpeg-bin/
          # Find the actual binary (might be nested under version folder on Windows)
          find /tmp/ffmpeg-bin -name "ffmpeg${{ matrix.ext }}" -type f -exec cp {} /tmp/ffmpeg-bin/ffmpeg${{ matrix.ext }} \; 2>/dev/null || true
          find /tmp/ffmpeg-bin -name "ffprobe${{ matrix.ext }}" -type f -exec cp {} /tmp/ffmpeg-bin/ffprobe${{ matrix.ext }} \; 2>/dev/null || true
          chmod +x /tmp/ffmpeg-bin/ffmpeg${{ matrix.ext }} /tmp/ffmpeg-bin/ffprobe${{ matrix.ext }} 2>/dev/null || true
          echo "ffmpeg version: $(/tmp/ffmpeg-bin/ffmpeg${{ matrix.ext }} -version 2>&1 | head -1)"
        shell: bash

      - name: PyInstaller 打包
        run: |
          pyinstaller --onefile --console `
            --add-data "/tmp/ffmpeg-bin/ffmpeg${{ matrix.ext }}.${{ matrix.separator }}." `
            --add-data "/tmp/ffmpeg-bin/ffprobe${{ matrix.ext }}.${{ matrix.separator }}." `
            --name "壁纸转换工具${{ matrix.ext }}" `
            --distpath dist `
            --workpath build `
            convert_wallpaper.py
        shell: pwsh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 壁纸转换工具-${{ matrix.label }}
          path: dist/壁纸转换工具${{ matrix.ext }}
          if-no-files-found: error

      - name: 创建 Release（仅 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/壁纸转换工具${{ matrix.ext }}
          generate_release_notes: true
