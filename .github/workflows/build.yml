name: Build macOS App

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: 打包 macOS 单文件
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pyinstaller

      - name: 下载 macOS ffmpeg 静态二进制
        run: |
          curl -L -o /tmp/ffmpeg.zip https://evermeet.cx/ffmpeg/ffmpeg-7.1.zip
          curl -L -o /tmp/ffprobe.zip https://evermeet.cx/ffmpeg/ffprobe-7.1.zip
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-bin/
          unzip -o /tmp/ffprobe.zip -d /tmp/ffmpeg-bin/
          chmod +x /tmp/ffmpeg-bin/ffmpeg /tmp/ffmpeg-bin/ffprobe
          echo "ffmpeg version: $(/tmp/ffmpeg-bin/ffmpeg -version 2>&1 | head -1)"

      - name: PyInstaller 打包
        run: |
          pyinstaller --onefile --console \
            --add-data "/tmp/ffmpeg-bin/ffmpeg:." \
            --add-data "/tmp/ffmpeg-bin/ffprobe:." \
            --name "壁纸转换工具" \
            --distpath dist \
            --workpath build \
            convert_wallpaper.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 壁纸转换工具-macOS
          path: dist/壁纸转换工具
          if-no-files-found: error

      - name: 创建 Release（仅 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/壁纸转换工具
          generate_release_notes: true
